name: Build artifacts

on:
  push:
    paths:
      - 'control-app/**'
      - 'webroot/**'
      - 'bin/**'
      - 'config/**'
      - 'rules/**'
      - 'system/**'
      - 'service.sh'
      - 'customize.sh'
      - 'action.sh'
      - 'uninstall.sh'
      - 'module.prop'
      - 'build_zip.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sad-control-apk
          path: control-app/app/build/outputs/apk/debug/*.apk

  module-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package module zip
        run: python3 build_zip.py

      - uses: actions/upload-artifact@v4
        with:
          name: sad-module-zip
          path: SAD-v*.zip
